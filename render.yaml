services:
  - type: web
    name: decodegene
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
